# The app-manager itself. Build and run on the machine whose Docker
# apps you want to manage (Mac for development, the Linux box for real).
services:
  app-manager:
    build: .
    image: app-manager
    container_name: app-manager
    ports:
      # Dashboard port, driven by MANAGER_PORT in the root .env file
      # (see .env.example; default 9000). Host port, container port
      # and the PORT the server listens on all follow it, so the
      # "listening on" log line always matches the published port.
      - "${MANAGER_PORT:-9000}:${MANAGER_PORT:-9000}"
    environment:
      PORT: ${MANAGER_PORT:-9000}
      # Set a real password before exposing the dashboard on the LAN —
      # it can start/stop containers and edit .env files.
      MANAGER_USER: admin
      MANAGER_PASSWORD: "change-me"
      # Optional: needed to watch private repos' GitHub Actions (and
      # raises the API rate limit for public ones). See README.
      # GITHUB_TOKEN: "ghp_..."
      # Folder picker start directory for Add Project → "from a
      # local folder": follows HOST_PROJECTS_DIR (see the mount
      # below), so the picker opens at your projects folder instead
      # of the container's filesystem root. "/" when unset.
      BROWSE_ROOT: ${HOST_PROJECTS_DIR:-/}
    volumes:
      # The manager drives the HOST Docker daemon through this socket.
      # (This is effectively root access to the host — see README.)
      - /var/run/docker.sock:/var/run/docker.sock
      # Live app registry and deployment data (deployments.jsonl +
      # .env backups + trigger state). The registry is READ-WRITE:
      # the Add App / Remove actions rewrite apps.json from the UI.
      - ./config:/app/config
      - ./data:/app/data
      # Where Add App clones new repos (APPS_ROOT, default /app/apps).
      - ./apps:/app/apps
      # Managed apps' workdirs MUST be mounted at the SAME absolute
      # path as on the host. The manager passes -f <workdir>/<composeFile>
      # and runs git inside <workdir>; the Docker daemon (over the
      # socket) also resolves the compose file's bind mounts and
      # relative paths on the host filesystem. If the paths differ
      # inside the container, git works on the wrong tree and the
      # daemon looks for files that do not exist. Example:
      # - /home/you/apps:/home/you/apps
      # Mounting a PARENT folder covers every project inside it with
      # one mount (this is also what Add Project → "from a local
      # folder" needs before the folder can be registered):
      # - /Users/you/Files/Project:/Users/you/Files/Project
      # The same mount, driven by .env instead of editing this file:
      # set HOST_PROJECTS_DIR in the root .env to the host folder
      # that holds your projects (for example
      # HOST_PROJECTS_DIR=/Users/you/Files/Project). It is mounted at
      # the SAME absolute path inside the container, and the folder
      # picker opens right there (BROWSE_ROOT above follows it).
      # Left unset, this mounts /tmp as a harmless placeholder.
      # NOTE: changing the mount needs `docker compose up -d` —
      # a plain `docker compose restart` does NOT apply new mounts.
      - ${HOST_PROJECTS_DIR:-/tmp}:${HOST_PROJECTS_DIR:-/tmp}
    restart: unless-stopped
